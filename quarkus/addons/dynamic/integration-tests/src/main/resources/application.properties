mp.messaging.incoming.resume.connector=quarkus-http
mp.messaging.incoming.resume.path=/resume

mp.messaging.outgoing.resume-out.connector=quarkus-http
mp.messaging.outgoing.resume-out.url=http://localhost:8081/resume

quarkus.devservices.enabled = false

# dynamic calls addon: authentication + explicit target-host allowlist (deny-all when unset)
kogito.dynamic.allowed-hosts=localhost
kogito.dynamic.mark-instances-dynamic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.tester=secret
quarkus.security.users.embedded.roles.tester=user
