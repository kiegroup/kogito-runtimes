name: Nightly Integration Tests – quarkus-reactive-messaging-http SNAPSHOT

on:
  schedule:
    # Run every night at 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      rmhttp_version:
        description: 'quarkus-reactive-messaging-http version to test against'
        required: false
        default: '999-SNAPSHOT'

concurrency:
  group: nightly-quarkus-reactive-messaging-http-snapshot
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  issues: write

env:
  JAVA_VERSION: 17
  MAVEN_VERSION: '3.9.11'
  RMHTTP_VERSION: ${{ github.event.inputs.rmhttp_version || '999-SNAPSHOT' }}
  # Absolute path so it resolves correctly regardless of the step's working-directory.
  SNAPSHOT_SETTINGS: ${{ github.workspace }}/kogito-runtimes/.github/central-snapshot-settings.xml
  # Maven CLI flags used in every invocation.
  MAVEN_ARGS: >-
    -B
    --no-transfer-progress
    --fail-at-end

jobs:
  build-kogito-runtimes:
    name: Build kogito-runtimes (quarkus-reactive-messaging-http ${{ github.event.inputs.rmhttp_version || '999-SNAPSHOT' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clean Disk Space
        uses: kiegroup/kie-ci/.ci/actions/ubuntu-disk-space@main

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          check-latest: true

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Checkout kogito-runtimes
        uses: actions/checkout@v7
        with:
          path: kogito-runtimes

      # Pin version.io.quarkiverse.reactivemessaging.http to the target SNAPSHOT in
      # the BOM so every downstream module picks it up without further changes.
      - name: Pin quarkus-reactive-messaging-http to ${{ env.RMHTTP_VERSION }}
        working-directory: kogito-runtimes
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn ${{ env.MAVEN_ARGS }} \
            --settings ${{ env.SNAPSHOT_SETTINGS }} \
            -pl :kogito-dependencies-bom \
            -Dproperty=version.io.quarkiverse.reactivemessaging.http \
            -DnewVersion=${{ env.RMHTTP_VERSION }} \
            -DgenerateBackupPoms=false \
            versions:set-property

      - name: Build kogito-runtimes (install, skip slow checks)
        working-directory: kogito-runtimes
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn ${{ env.MAVEN_ARGS }} \
            --settings ${{ env.SNAPSHOT_SETTINGS }} \
            -Dquickly \
            clean install

      - name: Cache local Maven repository for downstream jobs
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: nightly-rmhttp-snapshot-m2-${{ github.run_id }}

  integration-tests-runtimes:
    name: Integration Tests – kogito-runtimes reactive-messaging-http add-ons
    runs-on: ubuntu-latest
    needs: build-kogito-runtimes
    timeout-minutes: 60

    steps:
      - name: Clean Disk Space
        uses: kiegroup/kie-ci/.ci/actions/ubuntu-disk-space@main

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          check-latest: true

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Restore Maven cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: nightly-rmhttp-snapshot-m2-${{ github.run_id }}

      - name: Checkout kogito-runtimes
        uses: actions/checkout@v7
        with:
          path: kogito-runtimes

      # Modules that consume io.quarkiverse.reactivemessaging.http (the "quarkus-http"
      # connector and OutgoingHttpMetadata). The kogito-runtimes artifacts they depend
      # on are already installed by the build job, so each tree is verified standalone.
      - name: Run reactive-messaging-http add-on integration tests
        working-directory: kogito-runtimes
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          rc=0
          for module in \
            quarkus/addons/common/reactive-messaging \
            quarkus/addons/knative/eventing \
            quarkus/addons/jobs/knative-eventing; do
            echo "::group::mvn verify – ${module}"
            mvn ${{ env.MAVEN_ARGS }} \
              --settings ${{ env.SNAPSHOT_SETTINGS }} \
              -f "${module}/pom.xml" \
              clean verify || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: JUnit Report
        uses: kiegroup/kogito-pipelines/.ci/actions/action-junit-report@main
        if: always()
        with:
          report_paths: '**/*-reports/TEST-*.xml'

  integration-tests-kogito-examples:
    name: Integration Tests – kogito-examples serverless-workflow
    runs-on: ubuntu-latest
    needs: build-kogito-runtimes
    timeout-minutes: 120

    steps:
      - name: Clean Disk Space
        uses: kiegroup/kie-ci/.ci/actions/ubuntu-disk-space@main

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          check-latest: true

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Restore Maven cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: nightly-rmhttp-snapshot-m2-${{ github.run_id }}

      - name: Checkout kogito-runtimes
        uses: actions/checkout@v7
        with:
          path: kogito-runtimes

      - name: Checkout kogito-examples
        uses: actions/checkout@v7
        with:
          repository: kiegroup/kogito-examples
          ref: main
          path: kogito-examples

      - name: Run serverless-workflow-examples integration tests
        working-directory: kogito-examples/serverless-workflow-examples
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn ${{ env.MAVEN_ARGS }} \
            --settings ${{ env.SNAPSHOT_SETTINGS }} \
            -Dversion.io.quarkiverse.reactivemessaging.http=${{ env.RMHTTP_VERSION }} \
            clean verify

      - name: JUnit Report
        uses: kiegroup/kogito-pipelines/.ci/actions/action-junit-report@main
        if: always()
        with:
          report_paths: '**/*-reports/TEST-*.xml'

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs:
      - build-kogito-runtimes
      - integration-tests-runtimes
      - integration-tests-kogito-examples
    if: failure()

    steps:
      - name: Create GitHub Issue on failure
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ env.RMHTTP_VERSION }}';
            const label = 'quarkus-rmhttp-compatibility';

            // Check for an existing open issue to avoid duplicates
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Nightly run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) also failed against \`${version}\`.`,
              });
              return;
            }

            // Determine which jobs actually failed
            const jobs = [
              { id: 'build-kogito-runtimes', result: '${{ needs.build-kogito-runtimes.result }}' },
              { id: 'integration-tests-runtimes', result: '${{ needs.integration-tests-runtimes.result }}' },
              { id: 'integration-tests-kogito-examples', result: '${{ needs.integration-tests-kogito-examples.result }}' },
            ];
            const failed = jobs.filter(j => j.result === 'failure').map(j => `- \`${j.id}\``);
            const skipped = jobs.filter(j => j.result === 'skipped').map(j => `- \`${j.id}\` (skipped)`);
            const affectedLines = [...failed, ...skipped];

            const title = `[Nightly] Integration test failure – quarkus-reactive-messaging-http ${version}`;
            const body = [
              '## Nightly quarkus-reactive-messaging-http SNAPSHOT integration test failure',
              '',
              `**quarkus-reactive-messaging-http version:** \`${version}\``,
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'One or more jobs in the nightly integration test pipeline failed.',
              'Please investigate whether a breaking change was introduced in',
              '[quarkiverse/quarkus-reactive-messaging-http](https://github.com/quarkiverse/quarkus-reactive-messaging-http).',
              '',
              '### Failed jobs',
              ...affectedLines,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
